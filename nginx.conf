# Un solo dominio HTTPS: / sirve la página del invitado; /whip|/whep van a
# mediamtx. (WHIP/WHEP de mediamtx viven en /<path>/whip y /<path>/whep.)
server {
  listen 80;
  server_name _;

  location / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }

  # WebSocket del chat de la cabina → chatrelay
  location /ws/ {
    proxy_pass http://chatrelay:8085;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
  }

  # inv-<token>/whip (publicar) e inv-<token>/whep (ver) → mediamtx
  location ~ ^/(inv-[a-z0-9]+)/(whip|whep)$ {
    proxy_pass http://mediamtx:8889;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
