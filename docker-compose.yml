# Invitados — servidor WebRTC propio (tipo vdo.ninja, pero SFU: menor y más
# estable latencia, funciona con cualquier red del invitado).
#
# Despliegue en Coolify:
#   1. Crea un recurso "Docker Compose" y pega este archivo.
#   2. Asigna un dominio HTTPS al servicio `web` (p. ej. invitados.tudominio.com).
#      Coolify/Traefik se encarga del certificado — getDisplayMedia exige HTTPS.
#   3. IMPORTANTE: abre el puerto UDP 8189 en el firewall del VPS
#      (es el puerto único de WebRTC; sin él no fluye el video).
#   4. En la app: Ajustes → Invitados → pega https://invitados.tudominio.com
#
# El servicio `web` (nginx) sirve la página del invitado y hace proxy del
# WHIP/WHEP hacia mediamtx, así todo viaja por el MISMO dominio HTTPS.
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      # WebRTC por un único puerto UDP (más simple de abrir que un rango)
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:-invitados.example.com}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8189:8189/udp"   # ICE/medios WebRTC — DEBE estar abierto en el firewall
    expose:
      - "8889"            # WHIP/WHEP HTTP (solo interno; nginx hace proxy)

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [mediamtx]
    volumes:
      - ./guest.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"              # Coolify/Traefik publica esto con HTTPS
