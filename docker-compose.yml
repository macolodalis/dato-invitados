# Invitados — servidor WebRTC propio (tipo vdo.ninja, pero SFU: menor y más
# estable latencia, funciona con cualquier red del invitado).
#
# Despliegue en Coolify:
#   1. + New → Public Repository → URL de este repo → build pack "Docker Compose".
#   2. Variable de entorno PUBLIC_HOST = invitados.tudominio.com
#   3. Asigna ese dominio HTTPS al servicio `web` (puerto 80). Sin HTTPS el
#      navegador del invitado no permite compartir pantalla.
#   4. Abre el puerto UDP 8189 en el firewall del VPS (por ahí fluye el video).
#
# Los archivos de configuración van DENTRO de las imágenes (Dockerfiles):
# Coolify no monta archivos del repo en despliegues compose.
services:
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    restart: unless-stopped
    environment:
      # dominio público que MediaMTX anuncia en los candidatos ICE
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_HOST:-invitados.example.com}
    ports:
      - "8189:8189/udp"   # ICE/medios WebRTC — DEBE estar abierto en el firewall
    expose:
      - "8889"            # WHIP/WHEP HTTP (solo interno; nginx hace proxy)

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on: [mediamtx]
    expose:
      - "80"              # Coolify/Traefik publica esto con HTTPS
